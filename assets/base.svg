  <circle cx="181" cy="107" r="5" fill="#D89AAA"/>
  <circle cx="331" cy="107" r="5" fill="#D89AAA"/>

  <!-- Eyes -->
  <ellipse cx="229" cy="168" rx="13" ry="17" fill="#E8B8C4"/>
  <ellipse cx="283" cy="168" rx="13" ry="17" fill="#E8B8C4"/>

  <!-- Organic neural pathway -->
  <g
    stroke="#C96F86"
    stroke-width="5"
    stroke-linecap="round"
