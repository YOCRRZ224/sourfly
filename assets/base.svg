    <!-- visual input -->
    <path d="M229 168 C240 179 246 188 256 197"/>

    <path d="M283 168 C272 179 266 188 256 197"/>

    <!-- central integration -->
    <path d="M256 197 C238 214 232 231 240 250"/>
    <path d="M256 197 C274 214 280 231 272 250"/>

    <!-- descending pathways -->
    <path d="M240 250 C249 266 251 280 246 297"/>
    <path d="M272 250 C263 266 261 280 266 297"/>

    <path d="M246 297 C239 313 238 329 244 345"/>
    <path d="M266 297 C273 313 274 329 268 345"/>

    <!-- central output -->
    <path d="M244 345 C249 356 252 365 256 377"/>
    <path d="M268 345 C263 356 260 365 256 377"/>
  </g>

  <!-- Neural nodes -->
  <g fill="#C96F86">
    <circle cx="229" cy="168" r="7"/>
    <circle cx="283" cy="168" r="7"/>
    <circle cx="256" cy="197" r="8"/>
    <circle cx="240" cy="250" r="7"/>
    <circle cx="272" cy="250" r="7"/>
    <circle cx="246" cy="297" r="7"/>
    <circle cx="266" cy="297" r="7"/>
    <circle cx="244" cy="345" r="6"/>
    <circle cx="268" cy="345" r="6"/>
    <circle cx="256" cy="377" r="7"/>
